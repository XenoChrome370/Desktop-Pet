name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 1.2; only used for manual runs)"
        required: false
        default: "1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Print build environment
        run: |
          sw_vers
          uname -m
          swiftc --version

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "PET_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      - name: Build, self-test and package
        run: ./build.sh --package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: good-thing-pet-${{ env.PET_VERSION }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          body: |
            Download `GoodThingPet-*.dmg`, open it, and drag `GoodThingPet.app` into Applications.

            A zip is also available, but extract it with Finder. Terminal `unzip` mishandles non-ASCII filenames and reports `write error (disk full?)` while dropping files.

            The app is ad-hoc signed and not notarized. If Gatekeeper blocks the first launch, right-click the app and choose Open, or go to System Settings › Privacy & Security and click Open Anyway. If you have the Xcode Command Line Tools, `./install.sh --from /Applications/GoodThingPet.app` handles this step for you.

            Verify the download:

            ```sh
            shasum -a 256 -c GoodThingPet-*.sha256
            ```
